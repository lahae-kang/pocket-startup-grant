<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기업 운영 현황 · 미리보기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7f9; color:#172026; font:14px/1.5 Pretendard,system-ui,sans-serif; letter-spacing:0; }
    button,input,a { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible { outline:2px solid #2563eb; outline-offset:3px; }
    button:disabled { cursor:wait; opacity:.5; }
    a { color:inherit; }
    h1,h2,h3,p { margin:0; }
    svg { width:16px; height:16px; flex-shrink:0; }
    [hidden] { display:none!important; }
    .topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; padding:18px 28px; border-bottom:1px solid #e0e6eb; background:#fff; }
    .brand { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    h1 { font-size:20px; font-weight:600; }
    .preview-badge { padding:3px 7px; border:1px solid #dce4ed; border-radius:4px; color:#637489; font-size:11px; }
    .top-actions { display:flex; align-items:center; gap:14px; }
    .original-link { text-decoration:none; color:#4d6070; font-size:12px; display:flex; gap:5px; align-items:center; }
    .original-link:hover { color:#215bd1; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; background:#fff; border:1px solid #dce3ea; border-radius:5px; color:#526574; }
    .updated { color:#7c8a95; font-size:11px; }
    main { max-width:1700px; margin:auto; padding:20px 28px 28px; }
    .toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .tabs { display:flex; flex-wrap:wrap; gap:5px; }
    .tab { display:flex; align-items:center; gap:6px; padding:6px 10px; background:transparent; color:#62717c; border:1px solid transparent; border-radius:5px; font-size:12px; }
    .tab[aria-pressed="true"] { background:#202b35; color:#fff; border-color:#202b35; }
    .tab-count { opacity:.7; font-variant-numeric:tabular-nums; }
    .search-field { display:flex; align-items:center; gap:7px; width:230px; padding:7px 9px; border:1px solid #dce3e9; border-radius:5px; background:#fff; color:#88959f; }
    .search-field input { min-width:0; width:100%; border:0; outline:none; background:transparent; color:#172026; font-size:12px; }
    .overview { display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-bottom:18px; color:#657581; font-size:12px; }
    .overview strong { color:#253746; font-weight:500; }
    .overview .attention-total { color:#b0453a; }
    .company-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); align-items:start; gap:14px; }
    .company { min-width:0; border:1px solid #dce4eb; border-radius:7px; background:#fff; overflow:hidden; scroll-margin-top:15px; }
    .company.focused { outline:2px solid #88aef2; outline-offset:2px; }
    .company-header { background:#f1f6fc; padding:13px 14px 12px; }
    .company.ended .company-header,.company.pocket .company-header { background:#f1f3f5; }
    .company-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .company-name { display:flex; align-items:center; gap:5px; min-width:0; padding:0; border:0; background:transparent; text-align:left; color:#172026; font-size:15px; font-weight:600; }
    .company-name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .company-name svg { width:13px; height:13px; color:#94a1af; }
    .cycle { flex-shrink:0; color:#778592; font-size:11px; }
    .quota-row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:11px; }
    .remaining { font-size:23px; font-weight:600; line-height:1.25; font-variant-numeric:tabular-nums; }
    .remaining small { font-size:13px; font-weight:400; color:#596c7d; margin-left:3px; }
    .quota-caption { color:#718291; font-size:11px; }
    .company.fulfilled .remaining { color:#7c8b97; }
    .progress { display:flex; gap:4px; height:5px; margin-top:9px; }
    .progress span { flex:1; background:#dce4ec; border-radius:2px; }
    .progress .done { background:#4976d1; }
    .allocation-summary { display:flex; flex-wrap:wrap; gap:10px; margin-top:7px; color:#6a7c8b; font-size:11px; }
    .health { display:flex; flex-wrap:wrap; gap:6px 12px; padding:9px 14px; border-bottom:1px solid #e8edf1; color:#667987; font-size:11px; }
    .health span { display:flex; align-items:center; gap:4px; }
    .health svg { width:13px; height:13px; }
    .health .warn { color:#ac4437; }
    .grant-row { padding:11px 14px; border-bottom:1px solid #e8edf1; }
    .grant-row:last-child { border-bottom:0; }
    .grant-heading { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
    .grant-title { font-weight:500; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    a.grant-title:hover { text-decoration:underline; text-underline-offset:3px; }
    .deadline { flex-shrink:0; font-size:11px; color:#6e7d88; font-variant-numeric:tabular-nums; }
    .deadline.urgent { color:#b54639; }
    .grant-meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:7px; font-size:11px; }
    .status { display:inline-flex; align-items:center; justify-content:center; min-height:21px; padding:1px 5px; border-radius:4px; border:1px solid #d9e1e7; color:#364552; background:#fff; }
    .status.preparing,.status.ceo { background:#27333f; border-color:#27333f; color:#fff; }
    .status.material_done,.status.meeting { background:#edf3ff; border-color:#d9e5fe; color:#2d5fbd; }
    .status.completed,.status.paper_pass,.status.final_pass { color:#7b8790; background:#f3f5f6; border-color:#e1e6e9; }
    .plan-button { display:inline-flex; align-items:center; gap:4px; border:0; border-radius:3px; background:transparent; padding:2px 0; color:#697d8d; text-align:left; font-size:11px; }
    .plan-button svg { width:13px; height:13px; }
    .plan-button.warning { color:#b14438; }
    .plan-button:hover { text-decoration:underline; text-underline-offset:3px; }
    .ready-label { display:flex; align-items:center; gap:4px; color:#397c62; }
    .ready-label svg { width:13px; height:13px; }
    .completed-group,.history-group { margin:0 14px; color:#7b8a94; font-size:11px; }
    .completed-group summary,.history-group summary { padding:9px 0; cursor:pointer; }
    .completed-item { display:flex; justify-content:space-between; gap:7px; padding:6px 0; color:#7b8790; border-top:1px solid #eef1f3; }
    .completed-item span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .unassigned { padding:10px 14px; color:#7b8995; font-size:11px; border-top:1px solid #edf1f5; }
    .history-group { border-top:1px solid #edf1f5; }
    .history-group .grant-row { padding:9px 0; }
    .history-heading { margin:7px 0 0; font-size:11px; color:#71808e; }
    .empty,.error-state { padding:44px 18px; text-align:center; color:#7d8b97; font-size:13px; }
    .error-state { color:#a5483c; }
    .error-state button { margin-top:12px; border:1px solid #d7dfe6; border-radius:5px; background:#fff; padding:6px 12px; color:#526677; }
    .schedule-section { margin-top:24px; border-top:1px solid #dde5eb; padding-top:16px; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .section-head h2 { font-size:15px; font-weight:600; }
    .section-head small { color:#81909b; font-size:11px; }
    .schedule-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .schedule-day { min-width:0; min-height:110px; padding:9px; border:1px solid #dfe6eb; border-radius:5px; background:#fff; }
    .schedule-day.today { border-color:#c3d6fa; background:#f4f8ff; }
    .day-label { color:#617583; font-size:11px; margin-bottom:7px; }
    .schedule-event { display:block; width:100%; border:0; border-bottom:1px solid #e8edf1; padding:5px 0; background:transparent; text-align:left; color:#253a4c; font-size:11px; }
    .schedule-event:last-child { border-bottom:0; }
    .schedule-event span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .schedule-event small { color:#7b8c99; font-size:11px; }
    .schedule-event.meeting span { color:#4c6b91; }
    dialog { width:min(510px,calc(100vw - 30px)); max-height:80vh; overflow:auto; border:1px solid #d9e2ea; border-radius:8px; padding:0; color:#253642; box-shadow:0 16px 60px #14263b26; }
    dialog::backdrop { background:#172c3f45; }
    .dialog-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px 20px 13px; border-bottom:1px solid #e4eaf0; }
    .dialog-head h2 { font-size:16px; font-weight:600; overflow-wrap:anywhere; }
    .dialog-head p { color:#7e8b96; font-size:12px; margin-top:3px; }
    .dialog-body { padding:17px 20px 20px; font-size:13px; }
    .detail-row { display:grid; grid-template-columns:100px minmax(0,1fr); gap:12px; padding:8px 0; border-bottom:1px solid #edf1f4; }
    .detail-row span:first-child { color:#86939c; }
    .detail-row span:last-child { overflow-wrap:anywhere; white-space:pre-line; }
    .dialog-event { padding:9px 0; border-bottom:1px solid #edf1f4; }
    .dialog-note { color:#7a8b97; font-size:12px; padding:12px 0 0; }
    @media(min-width:1550px) { .company-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    @media(max-width:700px) { .topbar { padding:15px 16px; } main { padding:16px; } .updated { display:none; } .company-grid { grid-template-columns:minmax(0,1fr); } .toolbar { align-items:stretch; } .search-field { width:100%; } .schedule-grid { grid-template-columns:minmax(0,1fr); } .schedule-day { min-height:75px; } h1 { font-size:18px; } .top-actions { gap:9px; } .overview { gap:8px 14px; } }
    @media(pointer:coarse) { .tab,.icon-button,.plan-button,.company-name { min-height:40px; } input { font-size:16px!important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>기업 운영 현황</h1><span class="preview-badge">미리보기 · 읽기 전용</span></div>
    <div class="top-actions"><span class="updated" id="updated"></span><a class="original-link" href="https://lahae-kang.github.io/pocket-startup-grant/" target="_blank" rel="noreferrer">기존 대시보드<i data-lucide="arrow-up-right" aria-hidden="true"></i></a><button class="icon-button" id="refresh" title="서버 데이터 다시 조회" aria-label="새로고침"><i data-lucide="refresh-cw" aria-hidden="true"></i></button></div>
  </header>
  <main>
    <div class="toolbar"><div class="tabs" role="group" aria-label="기업 보기"><button class="tab" data-view="all" aria-pressed="true">전체 <span class="tab-count" data-count="all">0</span></button><button class="tab" data-view="attention" aria-pressed="false">확인 필요 <span class="tab-count" data-count="attention">0</span></button><button class="tab" data-view="pocket" aria-pressed="false">포켓 <span class="tab-count" data-count="pocket">0</span></button><button class="tab" data-view="ended" aria-pressed="false">종료 <span class="tab-count" data-count="ended">0</span></button></div><label class="search-field"><i data-lucide="search" aria-hidden="true"></i><input id="search" placeholder="기업명, 지원사업 검색" aria-label="기업 또는 지원사업 검색"></label></div>
    <div class="overview" id="overview"></div>
    <div id="message" class="empty" role="status" aria-live="polite">저장된 보드를 불러오는 중입니다.</div>
    <section class="company-grid" id="companies" aria-label="기업별 운영 카드"></section>
    <section class="schedule-section" id="schedule" hidden><div class="section-head"><h2>다가오는 작업 일정</h2><small id="schedule-range"></small></div><div class="schedule-grid" id="schedule-grid"></div></section>
  </main>
  <dialog id="detail"><div class="dialog-head"><div><h2 id="detail-title"></h2><p id="detail-subtitle"></p></div><button class="icon-button" id="close-detail" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="dialog-body" id="detail-body"></div></dialog>
  <script>
    (() => {
      const SUPABASE_URL = 'https://yoznpullugdnjrszhkon.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlvem5wdWxsdWdkbmpyc3poa29uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTA1ODEsImV4cCI6MjA5NjE2NjU4MX0.PCgNJWU0jihPDeAuU5gS5iwburWuzmTCOmLGdPTookw';
      const STORAGE_KEY = 'startup-grant-board-notion-v1';
      const labels = { request:'추천',confirmed:'컴펌완',preparing:'준비중',material_done:'자료완',meeting:'미팅',ceo:'대표님',completed:'완료',paper_pass:'서합',final_pass:'최합' };
      const aliases = { progress:'confirmed',ready:'preparing',done:'completed',delivered:'completed',passed:'final_pass' };
      const state = { data:null, models:[], view:'all', query:'', focused:'', request:0 };
      const byId = id => document.getElementById(id);
      const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const status = (company,id) => { const value=company.assignmentStatuses?.[id] || 'request'; return aliases[value] || value; };
      const finished = value => ['completed','paper_pass','final_pass'].includes(value);
      const dateKey = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      const today = () => dateKey(new Date());
      const validDate = value => typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(Date.parse(value));
      const short = value => validDate(value) ? `${Number(value.slice(5,7))}/${Number(value.slice(8,10))}` : '날짜 미확인';
      const daysLeft = value => validDate(value) ? Math.round((Date.parse(value)-Date.parse(today()))/86400000) : null;
      const deadlineLabel = value => { const d=daysLeft(value); return d===null ? '마감 미확인' : d===0 ? 'D-DAY' : d>0 ? `D-${d}` : `D+${Math.abs(d)}`; };
      const safeUrl = value => { try { const u=new URL(value); return ['http:','https:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } };
      function renderIcons() { if (window.lucide) window.lucide.createIcons({attrs:{width:16,height:16}}); }
      function preparation(grant,step,schedules) {
        if (finished(step)) return { kind:'done',text:'처리 완료',warning:false };
        if (step==='material_done') return { kind:'ready',text:'자료 준비 완료',warning:false };
        const dates=schedules.filter(s=>validDate(s.date)).map(s=>s.date).sort();
        const next=dates.find(d=>d>=today());
        const due=daysLeft(grant.deadline);
        if (due!==null && due<0) return {kind:'expired',text:'마감 경과 · 상태 확인',warning:true};
        if (!next) return dates.length ? {kind:'elapsed',text:`${short(dates.at(-1))} 일정 경과`,warning:true} : {kind:'missing',text:'일정 미등록',warning:true};
        if (validDate(grant.deadline) && next>grant.deadline) return {kind:'late',text:`${short(next)} · 마감 이후 작업`,warning:true};
        if (next===grant.deadline) return {kind:'lastday',text:`${short(next)} · 마감 당일 작업`,warning:true};
        if (due!==null && due<=2) return {kind:'urgent',text:`${short(next)} 예정 · 자료 확인`,warning:true};
        return {kind:'planned',text:`${short(next)} 준비 예정`,warning:false};
      }
      function buildModels(data) {
        const grantMap=new Map(data.grants.filter(Boolean).map(g=>[g.id,g]));
        const companyMap=new Map(data.companies.filter(Boolean).map(c=>[c.id,c]));
        const order=[...new Set([...(Array.isArray(data.companyOrder)?data.companyOrder:[]),...companyMap.keys()])];
        const schedules=Array.isArray(data.schedules)?data.schedules:[];
        return order.filter(id=>companyMap.has(id)).map(id=>{
          const company=companyMap.get(id);
          const target=Math.max(1,Math.floor(Number(company.monthlyTarget)||1));
          const round=Math.max(0,Math.floor(Number(company.round)||0));
          const pocket=round<1;
          const rawIds=Array.isArray(company.assignedGrantIds)?company.assignedGrantIds:[];
          const start=pocket?0:Math.max(0,(round-1)*target);
          const currentIds=new Set(pocket?rawIds:rawIds.slice(start,start+target));
          const entries=[...new Set(rawIds)].map(grantId=>{
            const grant=grantMap.get(grantId)||{id:grantId,title:'지원사업 정보 없음'};
            const step=status(company,grantId);
            const plans=schedules.filter(s=>s.type!=='meeting' && s.companyId===id && s.grantId===grantId).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
            return {grant,step,plans,prep:preparation(grant,step,plans),done:finished(step),current:currentIds.has(grantId)};
          });
          const current=entries.filter(e=>e.current).sort((a,b)=>String(a.grant.deadline||'9999').localeCompare(String(b.grant.deadline||'9999')));
          const complete=current.filter(e=>e.done);
          const active=current.filter(e=>!e.done);
          return {company,target,round,pocket,current,complete,active,history:entries.filter(e=>!e.current),remaining:pocket?null:Math.max(0,target-complete.length),unassigned:pocket?0:Math.max(0,target-current.length),warnings:active.filter(e=>e.prep.warning)};
        });
      }
      function grantRow(model,entry) {
        const {grant,step,prep}=entry;
        const href=safeUrl(grant.link);
        return `<div class="grant-row" data-grant-id="${esc(grant.id)}"><div class="grant-heading">${href?`<a class="grant-title" href="${esc(href)}" target="_blank" rel="noreferrer" title="${esc(grant.title)}">${esc(grant.title)}</a>`:`<span class="grant-title" title="${esc(grant.title)}">${esc(grant.title)}</span>`}<span class="deadline ${daysLeft(grant.deadline)!==null&&daysLeft(grant.deadline)<=5&&!entry.done?'urgent':''}">${esc(deadlineLabel(grant.deadline))}</span></div><div class="grant-meta"><span class="status ${esc(step)}">${esc(labels[step]||step)}</span>${prep.kind==='ready'?`<span class="ready-label">${icon('check')}${esc(prep.text)}</span>`:`<button class="plan-button ${prep.warning?'warning':''}" data-plan-company="${esc(model.company.id)}" data-plan-grant="${esc(grant.id)}">${icon(prep.warning?'calendar-clock':'calendar-days')}${esc(prep.text)}</button>`}</div></div>`;
      }
      function companyCard(model) {
        const {company,target,round,pocket,current,complete,active,remaining,unassigned,warnings}=model;
        const missing=active.filter(e=>e.prep.kind==='missing').length;
        const otherWarnings=warnings.length-missing;
        const planned=active.filter(e=>e.prep.kind==='planned').length;
        const ready=active.filter(e=>e.prep.kind==='ready').length;
        let warningLine=[missing?`<span class="warn">${icon('calendar-x')}일정 미등록 ${missing}</span>`:'',otherWarnings?`<span class="warn">${icon('circle-alert')}자료·일정 확인 ${otherWarnings}</span>`:''].join('');
        const inactiveLabel=remaining===0?'이번 회차 완료':'진행 중인 사업 없음';
        if(!active.length)warningLine=`<span>${icon(remaining===0?'check':'minus')}${inactiveLabel}</span>`;
        return `<article class="company ${company.contractEnded?'ended':''} ${pocket?'pocket':''} ${remaining===0?'fulfilled':''} ${state.focused===company.id?'focused':''}" data-company-id="${esc(company.id)}"><div class="company-header"><div class="company-title"><button class="company-name" data-info="${esc(company.id)}" title="기업 정보 보기"><span>${esc(company.name||'이름 없는 기업')}</span>${icon('chevron-down')}</button><span class="cycle">${company.contractEnded?'종료 · ':''}${pocket?'포켓':`${round}회차`}</span></div><div class="quota-row"><div class="remaining">${pocket?active.length:remaining}<small>${pocket?'건 진행 중':'건 남음'}</small></div><span class="quota-caption">${pocket?`완료 ${complete.length}건`:`이번 회차 완료 ${complete.length}/${target}`}</span></div>${pocket?'':`<div class="progress" role="img" aria-label="${target}건 중 ${complete.length}건 완료">${Array.from({length:Math.min(target,30)},(_,i)=>`<span class="${i<complete.length?'done':''}"></span>`).join('')}</div>`}<div class="allocation-summary"><span>배정 ${current.length}${pocket?'':` / 약정 ${target}`}</span><span>완료 ${complete.length}</span>${pocket?'':`<span>미배정 ${unassigned}</span>`}</div></div><div class="health">${warningLine || (active.length?`<span>${icon('calendar-check')}${planned?`작업 예정 ${planned}`:''}${planned&&ready?' · ':''}${ready?`자료완 ${ready}`:''}</span>`:`<span>${icon('check')}이번 회차 완료</span>`)}</div>${active.map(e=>grantRow(model,e)).join('')}${complete.length?`<details class="completed-group"><summary>완료 ${complete.length}건</summary>${complete.map(e=>`<div class="completed-item"><span title="${esc(e.grant.title)}">${esc(e.grant.title)}</span><span>${esc(labels[e.step])}</span></div>`).join('')}</details>`:''}${unassigned?`<div class="unassigned">추가 배정 ${unassigned}건 필요</div>`:''}${model.history.length?`<details class="history-group"><summary>다른 회차 배정 ${model.history.length}건</summary>${model.history.map(e=>grantRow(model,e)).join('')}</details>`:''}</article>`;
      }
      function filteredModels() {
        return state.models.filter(m=>state.view==='ended'?m.company.contractEnded:!m.company.contractEnded)
          .filter(m=>state.view!=='pocket'||m.pocket)
          .filter(m=>state.view!=='attention'||m.warnings.length>0||m.unassigned>0)
          .filter(m=>!state.query||[m.company.name,...m.current.map(e=>e.grant.title)].join(' ').toLowerCase().includes(state.query));
      }
      function render() {
        if (!state.data) return;
        const active=state.models.filter(m=>!m.company.contractEnded);
        const attention=active.filter(m=>m.warnings.length||m.unassigned);
        const counts={all:active.length,attention:attention.length,pocket:active.filter(m=>m.pocket).length,ended:state.models.filter(m=>m.company.contractEnded).length};
        document.querySelectorAll('[data-count]').forEach(el=>el.textContent=counts[el.dataset.count]);
        document.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.view===state.view)));
        const items=filteredModels();
        byId('overview').innerHTML=`<span>기업 <strong>${active.length}</strong></span><span>현재 회차 남은 지원 <strong>${active.reduce((sum,m)=>sum+(m.remaining||0),0)}건</strong></span><span>추가 배정 필요 <strong>${active.reduce((sum,m)=>sum+m.unassigned,0)}건</strong></span><span class="attention-total">자료·일정 확인 ${active.reduce((sum,m)=>sum+m.warnings.length,0)}건</span>`;
        byId('companies').innerHTML=items.map(companyCard).join('');
        byId('message').hidden=items.length>0;
        byId('message').className='empty';
        byId('message').textContent='해당하는 기업이 없습니다.';
        renderSchedules();
        renderIcons();
      }
      function renderSchedules() {
        const days=[];
        const date=new Date(); date.setHours(0,0,0,0);
        while(days.length<5) { if(date.getDay()!==0&&date.getDay()!==6) days.push(dateKey(date)); date.setDate(date.getDate()+1); }
        const companies=new Map(state.models.map(m=>[m.company.id,m.company]));
        const grants=new Map(state.data.grants.map(g=>[g.id,g]));
        const schedules=Array.isArray(state.data.schedules)?state.data.schedules:[];
        byId('schedule').hidden=false;
        byId('schedule-range').textContent=`${short(days[0])} – ${short(days.at(-1))}`;
        byId('schedule-grid').innerHTML=days.map(day=>{
          const d=new Date(`${day}T12:00:00`);
          const events=schedules.filter(s=>s.date===day&&companies.has(s.companyId)).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
          return `<div class="schedule-day ${day===today()?'today':''}"><div class="day-label">${short(day)} ${['일','월','화','수','목','금','토'][d.getDay()]}</div>${events.map(event=>`<button class="schedule-event ${event.type==='meeting'?'meeting':''}" data-focus-company="${esc(event.companyId)}"><span>${event.time?`${esc(event.time)} `:''}${esc(companies.get(event.companyId).name)}</span><small>${event.type==='meeting'?esc(event.kind==='ir'?'IR':event.kind==='work'?(event.title||'작업'):'미팅'):esc(grants.get(event.grantId)?.title||'지원사업')}</small></button>`).join('')}</div>`;
        }).join('');
      }
      function openDialog(title,subtitle,body) {
        byId('detail-title').textContent=title;
        byId('detail-subtitle').textContent=subtitle;
        byId('detail-body').innerHTML=body;
        renderIcons(); byId('detail').showModal();
      }
      document.addEventListener('click',event=>{
        const tab=event.target.closest('[data-view]');
        if(tab) {state.view=tab.dataset.view;state.focused='';render();}
        const info=event.target.closest('[data-info]');
        if(info) {
          const model=state.models.find(m=>m.company.id===info.dataset.info); if(!model)return;
          const c=model.company;
          openDialog(c.name,'기업 정보',[['지역',c.region||'지역 미입력'],['설립일',c.foundedDate||'예비'],['현재 회차',model.pocket?'포켓':`${model.round}회차`],['이번 회차 약정',model.pocket?'횟수 제한 없음':`${model.target}건`],['완료',`${model.complete.length}건`],['남은 지원',model.pocket?'포켓':`${model.remaining}건`],['메모',c.memo||'-']].map(([label,value])=>`<div class="detail-row"><span>${label}</span><span>${esc(value)}</span></div>`).join(''));
        }
        const plan=event.target.closest('[data-plan-company]');
        if(plan) {
          const m=state.models.find(m=>m.company.id===plan.dataset.planCompany); const e=[...m.current,...m.history].find(e=>e.grant.id===plan.dataset.planGrant); if(!e)return;
          openDialog(e.grant.title,m.company.name,`<div class="detail-row"><span>진행 단계</span><span>${esc(labels[e.step]||e.step)}</span></div><div class="detail-row"><span>지원 마감</span><span>${esc(e.grant.deadline||'미입력')} · ${esc(deadlineLabel(e.grant.deadline))}</span></div><div class="detail-row"><span>자료·일정</span><span>${esc(e.prep.text)}</span></div>${e.plans.length?e.plans.map(s=>`<div class="dialog-event">${esc(s.date)}${s.time?` · ${esc(s.time)}`:''}</div>`).join(''):'<p class="dialog-note">등록된 지원사업 작업 일정이 없습니다.</p>'}`);
        }
        const focus=event.target.closest('[data-focus-company]');
        if(focus) { state.view='all'; state.query=''; byId('search').value=''; state.focused=focus.dataset.focusCompany; const model=state.models.find(m=>m.company.id===state.focused); if(model?.company.contractEnded)state.view='ended'; render(); const card=[...document.querySelectorAll('[data-company-id]')].find(el=>el.dataset.companyId===state.focused); card?.scrollIntoView({behavior:'smooth',block:'center'}); }
      });
      byId('search').addEventListener('input',event=>{state.query=event.target.value.trim().toLowerCase();render();});
      byId('close-detail').addEventListener('click',()=>byId('detail').close());
      byId('detail').addEventListener('click',event=>{if(event.target===byId('detail')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();}});
      async function load() {
        const id=++state.request;
        byId('refresh').disabled=true;
        byId('message').hidden=false; byId('message').className='empty'; byId('message').textContent='저장된 보드를 불러오는 중입니다.';
        const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),15000);
        try {
          const url=new URL(`${SUPABASE_URL}/rest/v1/app_state`); url.searchParams.set('id',`eq.${STORAGE_KEY}`); url.searchParams.set('select','data,updated_at');
          const response=await fetch(url,{method:'GET',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`},signal:controller.signal,cache:'no-store'});
          if(!response.ok)throw new Error(`서버 조회 실패 (${response.status})`);
          const rows=await response.json(); const data=rows?.[0]?.data;
          if(!data||!Array.isArray(data.companies)||!Array.isArray(data.grants))throw new Error('저장된 보드를 확인할 수 없습니다.');
          if(id!==state.request)return;
          state.data=data;state.models=buildModels(data);render();
          byId('updated').textContent=`조회 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`;
        } catch(error) {
          if(id!==state.request)return;
          byId('message').hidden=false;byId('message').className='error-state';
          byId('message').innerHTML=`<p>${esc(error.name==='AbortError'?'서버 응답이 지연되고 있습니다.':error.message)}</p><button id="retry">다시 조회</button>`;
          byId('retry').addEventListener('click',load);
        } finally {clearTimeout(timer);if(id===state.request)byId('refresh').disabled=false;}
      }
      byId('refresh').addEventListener('click',load);
      window.addEventListener('DOMContentLoaded',renderIcons);
      load();
    })();
  </script>
</body>
</html>
